<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسائل شكر - خط الدفاع الأول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
body{
    background:#fdf5f2;
    font-family:'Tajawal', sans-serif;
    color:#5d4037;

    display:flex;
    flex-direction:column;
    align-items:center;

    min-height:100vh;
    overflow-x:hidden;
}

/* تصميم الظرف */
.envelope-wrapper{
    position:relative;

    width:340px;
    min-height:240px;

    margin:100px auto;

    border-radius:14px;

    background:
    linear-gradient(
        145deg,
        #caa892 0%,
        #b08972 45%,
        #8d6e63 100%
    );

    box-shadow:
    0 15px 35px rgba(0,0,0,0.14),
    inset 0 2px 10px rgba(255,255,255,0.12);

    overflow:visible;
}

/* جسم الظرف */
.envelope-wrapper::before{
    content:"";

    position:absolute;
    inset:0;

    background:
    linear-gradient(
        to bottom,
        #d9b7a4,
        #996f5f
    );

    clip-path:polygon(
        0 0,
        50% 52%,
        100% 0,
        100% 100%,
        0 100%
    );

    border-radius:14px;

    z-index:1;
}

/* غطاء الظرف */
.flap {
    position: absolute;
    top: -120px; 
    left: 0;
    width: 100%;
    height: 120px;
    background: #8d6e63; /* لون صريح عشان ما يختفيش */
    clip-path: polygon(0 100%, 50% 0, 100% 100%);
    transform-origin: bottom; /* الدوران من القاعدة */
    transition: transform 0.8s ease-in-out;
    z-index: 50; /* رقم عالي عشان يفضل فوق جسم الظرف */
    backface-visibility: visible; /* عشان نشوفه وهو بينقلب */
}


/*االورقة*/
.letter {
	position: relative;
	z-index: 99; /* رقم كبير جداً عشان تضمنين إنها فوق كل حاجة */
    width: 88%;
    min-height: 190px;
    /* التعديل هنا: زدنا المسافة العلوية لتبدأ من أسفل قاعدة الغطاء */
    margin: 10px auto 20px; 
    background: #fffdfa;
    border: 1px solid #eaded8;
    border-radius: 12px;
    padding: 22px;
    box-sizing: border-box;
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(0,0,0,0.08);
    /* التعديل هنا: جعلناها خلف الغطاء (الذي هو 5) وأمام الجسم */
    transition: transform 1s cubic-bezier(.68,-0.2,.27,1.2);
}

/* textarea */
textarea{
    width:100%;
    min-height:140px;

    border:none;
    outline:none;

    resize:none;

    background:transparent;

    overflow:hidden;

    font-size:15px;
    line-height:30px;

    color:#5d4037;

    font-family:'Tajawal',sans-serif;

    background-image:
    linear-gradient(#eaded8 1px, transparent 1px);

    background-size:100% 30px;
}

/* حركة الإرسال */
.sent .letter {
    /* الورقة تنزل لأسفل وتصغر قليلاً لتبدو كأنها دخلت الظرف */
    transform: translateY(110px) scale(0.95);
    z-index: 0; /* تصبح خلف كل شيء */
}

/* حركة الإرسال - إغلاق الغطاء */
.sent .flap {
	z-index: 100;
    /* ينقلب للأسفل ليغطي جسم الظرف */
    transform: rotateX(-180deg); 
}


/* الرسائل */
.messages-container{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));

    gap:22px;

    width:100%;
    max-width:1100px;

    margin:auto;

    padding:20px;
}

.vintage-card{
    background:
    linear-gradient(
        to bottom,
        #fffdfa,
        #f9efe8
    );

    border:1px solid #eaded8;

    border-radius:18px;

    padding:22px;

    line-height:2;

    box-shadow:
    0 10px 24px rgba(0,0,0,0.07);

    transition:0.3s;
}

.vintage-card:hover{
    transform:translateY(-4px);

    box-shadow:
    0 14px 30px rgba(0,0,0,0.10);
}
    </style>
</head>
<body>

    <!-- الجزء الأول: عرض الرسائل -->
    <section class="max-w-5xl mx-auto mt-10">
        <h1 class="text-3xl text-center mb-8 font-bold">رسائل ممتنة لخط دفاعنا الأول</h1>
        <div id="messages-list" class="messages-container">
            <!-- الرسائل من فايربيس ستظهر هنا -->
            <div class="vintage-card">شكراً لكل من سهر لراحتنا.. أنتم فخرنا.</div>
        </div>
    </section>

    <hr class="my-20 border-pink-200">

    <!-- الجزء الثاني: كتابة رسالة (الظرف) -->
    <section class="pb-20">
        <h2 class="text-2xl text-center mb-5">اكتب رسالتك الخاصة</h2>
        <div class="envelope-wrapper" id="envelope">
            <div class="flap"></div>
            <div class="letter" id="letter-sheet" style="bottom: 100px;">
                <textarea id="message-text" placeholder="اكتب كلماتك من القلب..."></textarea>
            </div>
        </div>

        <div class="text-center mt-10">
            <button onclick="sendLetter()" id="send-btn" class="bg-[#8d6e63] text-white px-8 py-2 rounded-full hover:bg-[#6d4c41] transition">
                إرسال الرسالة
            </button>
        </div>
    </section>

    <!-- ربط Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- هنا تضعين بيانات الفايربيس الخاصة بك ---
        const firebaseConfig = {
            apiKey: "AIzaSyC-3K_Cgx4daxN9EsCG7DS30knxAlKsJFo",
            authDomain: "heroes-pride-wall.firebaseapp.com",
            projectId: "heroes-pride-wall",
            storageBucket: "heroes-pride-wall.firebasestorage.app",
            messagingSenderId: "718173822562",
            appId: "1:718173822562:web:c11036e15b1a5bc44ebb3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // وظيفة الإرسال
        window.sendLetter = async () => {
            const text = document.getElementById('message-text').value;
            if(!text) return alert("من فضلك اكتب شيئاً!");

            try {
                // حفظ في فايربيس
                await addDoc(collection(db, "thanks_messages"), {
                    content: text,
                    timestamp: new Date()
                });

                // حركة الظرف
                const envelope = document.getElementById('envelope');
                const letter = document.getElementById('letter-sheet');
                
                // الورقة تدخل
                setTimeout(() => {
                    envelope.classList.add('sent'); // الغطاء يغلق
                }, 400);

                setTimeout(() => {
                    alert("تم إرسال رسالتك بنجاح!");
                    location.reload(); // إعادة تحميل لرؤية الرسالة الجديدة
                }, 1500);

            } catch (e) {
                console.error("Error adding document: ", e);
            }
        };

        // وظيفة جلب الرسائل
        const loadMessages = async () => {
            const q = query(collection(db, "thanks_messages"), orderBy("timestamp", "desc"));
            const querySnapshot = await getDocs(q);
            const list = document.getElementById('messages-list');
            list.innerHTML = ""; // مسح التجريبي
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const card = `<div class="vintage-card">${data.content}</div>`;
                list.innerHTML += card;
            });
        };

        loadMessages();
    </script>
</body>
</html>
